[build]
  publish = "."

[[redirects]]
  from = "/contact"
  to = "/#booking"
  status = 301

[[redirects]]
  from = "/impressum/"
  to = "/impressum.html"
  status = 301

# Netlify falls back to the root 404.html inside /de/, so route it explicitly.
# Without force, existing files still win over this rule.
[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404
