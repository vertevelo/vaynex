[build]
  publish = "."

[[redirects]]
  from = "/contact"
  to = "/#booking"
  status = 301

[[redirects]]
  from = "/impressum/"
  to = "/impressum.html"
  status = 301

# Netlify falls back to the root 404.html inside /de/, so route it explicitly.
# Without force, existing files still win over this rule.
[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404

# Virtual Coffee is English and German only (the call too), send IT/FR visitors to the English page
[[redirects]]
  from = "/it/coffee/*"
  to = "/coffee/"
  status = 301

[[redirects]]
  from = "/fr/coffee/*"
  to = "/coffee/"
  status = 301

[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404

[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404
